<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Filename}} - {{.Hostname}}</title>
    <meta name="description" content="Download {{.Filename}}">
    <link rel="stylesheet" href="../styles/main.css">
    <script src="../scripts/vendor/modernizr.js"></script>
</head>

<body id="download">

<nav id="navigation">
    <div class="container">
        <a href="/">
            <h1>{{.Hostname}}</h1>
        </a>
    </div>
</nav>

<section id="home">
    <div class="wrapper">

        <div class="download-header">
            <h1 class="file-title">{{.Filename}}</h1>
            <div class="file-meta">
                <span class="file-type">{{.ContentType}}</span>
                <span class="file-size">{{.ContentLength | format "#,###."}} bytes</span>
            </div>
        </div>

        <div class="download-actions">
            <a href="{{.URL}}" class="btn btn-primary">Download</a>
            <button id="fire-delete" class="btn btn-destructive">Delete File</button>
        </div>

        <div class="deletion-info">
            <div class="deletion-label">Deletion Token</div>
            <div class="deletion-token" id="deletion-token" tabindex="0" title="Click to copy deletion token">{{.DeletionToken}}</div>
            <div class="deletion-note">Save this token to delete the file later. Click to copy to clipboard.</div>
        </div>

        <div class="qr-section">
            <details class="qr-details">
                <summary class="qr-summary">Show QR Code</summary>
                <div class="qr-content">
                    <div class="qr-code" id="qr"></div>
                </div>
            </details>
        </div>

        <div class="row animated fadeInDown">
            <div id="from-terminal" class=" box col-md-8  col-md-offset-2 col-xs-12">
                <div class="terminal-top">
                </div>
                <div id="terminal" class="terminal">
                    <div id="md-preview">{{.Content}}</div>
                </div>
            </div>
        </div>
        <br/>

        <!-- Delete functionality is now integrated into download-top.html -->

        <br/>
    </div>
</section>



    <script src="../scripts/main.js"></script>


</body>

</html>
