<!doctype html>
<html lang="en">

include "includes/head.html"

<body>

include "includes/navigation.html"

<main>
    <div class="container">
        <div class="upload-area" id="upload-area">
            <p class="upload-description">Drop files here or <a class="browse" href="#">browse</a></p>
            <input type="file" multiple id="file-input" hidden>
        </div>
        
        <div class="file-queue" id="file-queue">
            <div class="queue-header">
                <h3 class="queue-title">Files</h3>
                <div class="queue-actions">
                    <button id="download-all" class="download-all btn" disabled>Copy link</button>
                    <button id="clear-all" class="clear-all btn" disabled>Clear</button>
                </div>
            </div>
            <ul class="queue"></ul>
            <div class="queue-empty">No files uploaded</div>
        </div>
    </div>
</main>

include "includes/js.html"

</body>
</html>
