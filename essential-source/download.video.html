<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Filename}} - {{.Hostname}}</title>
    <meta name="description" content="Watch and download {{.Filename}}">
    <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
    <header>
        <h1><a href="/">{{.Hostname}}</a></h1>
        <nav>
            <a href="/">Share Files</a>
        </nav>
    </header>
    
    <main>
        <section>
            <div class="file-name">{{.Filename}}</div>
            <div class="file-details">{{.ContentType}} • {{.ContentLength | format "#,###."}} bytes</div>
            
            <div style="margin: 2rem 0;">
                <video controls style="max-width: 100%; height: auto; border-radius: 0.25rem;">
                    <source src="{{.URL}}" type="{{.ContentType}}">
                    Your browser does not support the video element.
                    <a href="{{.URLGet}}">Download video file</a>
                </video>
            </div>
            
            <div class="file-actions">
                <button onclick="window.location.href='{{.URLGet}}'">Download</button>
                <button class="secondary" onclick="copyToClipboard('{{.URL}}', this)">Copy Link</button>
            </div>
        </section>
    </main>

    <script>
    // Format file size for display
    function formatFileSize(bytes) {
        if (bytes >= 1024 * 1024 * 1024) {
            return (bytes / (1024 * 1024 * 1024)).toFixed(1) + 'GB';
        } else if (bytes >= 1024 * 1024) {
            return (bytes / (1024 * 1024)).toFixed(1) + 'MB';
        } else {
            return Math.round(bytes / 1024) + 'KB';
        }
    }
    
    async function copyToClipboard(text, button) {
        try {
            await navigator.clipboard.writeText(text);
            const originalText = button.textContent;
            button.textContent = 'Copied!';
            button.style.backgroundColor = '#28a745';
            setTimeout(() => {
                button.textContent = originalText;
                button.style.backgroundColor = '';
            }, 1500);
        } catch (error) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.opacity = '0';
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            
            const originalText = button.textContent;
            button.textContent = 'Copied!';
            button.style.backgroundColor = '#28a745';
            setTimeout(() => {
                button.textContent = originalText;
                button.style.backgroundColor = '';
            }, 1500);
        }
    }
    </script>
</body>
</html>
