<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Filename}} - {{.Hostname}}</title>
    <meta name="description" content="Download {{.Filename}}">
    <link rel="stylesheet" href="/styles/main.css">
</head>
<body class="download-page">

<nav id="navigation">
    <div class="container">
        <a href="/">
            <h1>{{.Hostname}}</h1>
        </a>
    </div>
</nav>

<main>
    <div class="container">
        <h1>{{.Filename}}</h1>
        <div class="meta mono">{{.ContentType}} · {{.ContentLength}} bytes</div>
        
        <video controls class="preview">
            <source src="{{.URL}}" type="{{.ContentType}}">
            Your browser does not support the video element.
        </video>
        
        <div class="actions">
            <button id="copy-link" class="btn btn-primary" data-url="{{.URL}}">Copy Link</button>
            <a href="{{.URLGet}}" class="btn">Download</a>
            <a href="/" class="btn">Upload More</a>
        </div>
    </div>
</main>

<script>
document.getElementById('copy-link').addEventListener('click', function() {
    const url = this.dataset.url;
    const fullUrl = url.startsWith('http') ? url.replace('/get', '') + '?dl=1' : window.location.origin + '/get' + url;
    navigator.clipboard.writeText(fullUrl).then(() => {
        const originalText = this.textContent;
        this.textContent = 'Copied!';
        setTimeout(() => {
            this.textContent = originalText;
        }, 2000);
    }).catch(() => {
        const textArea = document.createElement('textarea');
        textArea.value = fullUrl;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
        
        const originalText = this.textContent;
        this.textContent = 'Copied!';
        setTimeout(() => {
            this.textContent = originalText;
        }, 2000);
    });
});
</script>

</body>
</html>
