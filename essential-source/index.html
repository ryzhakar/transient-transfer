<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer Files</title>
    <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
    <!-- Skip to main content for keyboard users -->
    <a href="#main-content" class="skip-link">Skip to main content</a>
    
    <!-- State: Empty (header + fullscreen upload) -->
    <header id="parcel-header">
        <h1>PARCEL</h1>
    </header>
    
    <main id="main-content">
        <section id="upload-section">
            <div id="drop-area">
                <input type="file" id="file-input" multiple>
                <div id="drop-text">
                    <span>Drag files here or <strong>choose files</strong></span>
                </div>
            </div>
        </section>
        
        <!-- State: With files (hidden initially) -->
        <section id="controls-section" style="display: none;">
            <button id="copy-zip-btn" style="display: none;" onclick="copyZipLink()">Copy All Files</button>
        </section>
        
        <section id="file-list-section" style="display: none;">
            <div id="file-list">
                <!-- Files appear here after upload -->
            </div>
        </section>
    </main>

    <script>
    /**
     * Sequential Animation Manager using Web Animations API
     * Adapted for transfer.sh backend integration
     */
    class TransferSequentialAnimationManager {
        constructor() {
            this.state = 'EMPTY';
            this.isAnimating = false;
            this.activeAnimations = [];
            this.uploadedFiles = [];
            
            // Cache DOM elements
            this.elements = {
                header: document.getElementById('parcel-header'),
                uploadSection: document.getElementById('upload-section'),
                dropArea: document.getElementById('drop-area'),
                controlsSection: document.getElementById('controls-section'),
                fileListSection: document.getElementById('file-list-section'),
                fileList: document.getElementById('file-list'),
                copyZipBtn: document.getElementById('copy-zip-btn'),
                fileInput: document.getElementById('file-input')
            };
            
            // Store initial measurements for restoration
            this.updateMeasurements();
            
            this.setupEventListeners();
        }
        
        /**
         * Update measurements for current viewport
         */
        updateMeasurements() {
            this.initialMeasurements = {
                headerHeight: this.elements.header.offsetHeight,
                uploadSectionHeight: this.elements.uploadSection.offsetHeight
            };
        }
        
        /**
         * Web Animations API wrapper with Promise-based control
         */
        async animate(element, keyframes, options = {}) {
            const defaultOptions = {
                duration: 300,
                easing: 'cubic-bezier(0.4, 0, 0.2, 1)',
                fill: 'forwards'
            };
            
            const animation = element.animate(keyframes, { ...defaultOptions, ...options });
            this.activeAnimations.push(animation);
            
            try {
                await animation.finished;
            } catch (error) {
                console.log('Animation cancelled:', error);
            } finally {
                this.activeAnimations = this.activeAnimations.filter(a => a !== animation);
            }
            
            return animation;
        }
        
        /**
         * Measure element's natural height
         */
        measureAutoHeight(element) {
            const originalHeight = element.style.height;
            const originalDisplay = element.style.display;
            
            element.style.height = 'auto';
            element.style.display = element.style.display || 'block';
            const autoHeight = element.offsetHeight;
            
            element.style.height = originalHeight;
            element.style.display = originalDisplay;
            return autoHeight;
        }
        
        /**
         * CRITICAL: Sequential transformation EMPTY → HAS_FILES
         * Each step waits for the previous to complete
         */
        async transformToFileState() {
            if (this.isAnimating) return;
            this.isAnimating = true;
            this.state = 'TRANSITIONING';
            
            try {
                // STEP A: Header disappears (slide up + opacity + height collapse)
                await Promise.all([
                    this.animate(this.elements.header, [
                        { opacity: 1, transform: 'translateY(0)' },
                        { opacity: 0, transform: 'translateY(-50px)' }
                    ], { duration: 300 }),
                    this.animate(this.elements.header, [
                        { 
                            height: `${this.elements.header.offsetHeight}px`,
                            paddingTop: 'var(--space-xxl)',
                            paddingBottom: 'var(--space-xxl)'
                        },
                        { 
                            height: '0px',
                            paddingTop: '0px',
                            paddingBottom: '0px'
                        }
                    ], { duration: 400 })
                ]);
                
                this.elements.header.style.display = 'none';
                
                // STEP B: Upload area shrinks to compact size
                const currentHeight = this.elements.uploadSection.offsetHeight;
                // Responsive compact height: 120px desktop, 80px mobile
                const compactHeight = window.innerWidth <= 768 ? 80 : 120;
                
                // Only animate height, keep flex separate to prevent overshooting
                await this.animate(this.elements.uploadSection, [
                    { height: `${currentHeight}px` },
                    { height: `${compactHeight}px` }
                ], { duration: 400 });
                
                this.elements.uploadSection.style.height = `${compactHeight}px`;
                this.elements.uploadSection.style.flex = '0 0 auto';
                
                // STEP C: Controls appear (slide down)
                this.elements.controlsSection.style.display = 'block';
                await this.animate(this.elements.controlsSection, [
                    { opacity: 0, transform: 'translateY(-20px)' },
                    { opacity: 1, transform: 'translateY(0)' }
                ], { duration: 300 });
                
                // STEP D: File list appears
                this.elements.fileListSection.style.display = 'block';
                await this.animate(this.elements.fileListSection, [
                    { opacity: 0 },
                    { opacity: 1 }
                ], { duration: 200 });
                
                // Enable scrolling and add top spacing since header is gone
                document.body.style.overflow = 'auto';
                document.body.style.height = 'auto';
                this.elements.uploadSection.parentElement.style.paddingTop = 'var(--space-xxl)';
                
                this.state = 'HAS_FILES';
            } finally {
                this.isAnimating = false;
            }
        }
        
        /**
         * CRITICAL: Sequential transformation HAS_FILES → EMPTY (reverse order)
         */
        async transformToEmptyState() {
            if (this.isAnimating) return;
            this.isAnimating = true;
            this.state = 'TRANSITIONING';
            
            try {
                // STEP A: File list disappears
                await this.animate(this.elements.fileListSection, [
                    { opacity: 1 },
                    { opacity: 0 }
                ], { duration: 200 });
                this.elements.fileListSection.style.display = 'none';
                
                // STEP B: Controls disappear
                await this.animate(this.elements.controlsSection, [
                    { opacity: 1, transform: 'translateY(0)' },
                    { opacity: 0, transform: 'translateY(-20px)' }
                ], { duration: 300 });
                this.elements.controlsSection.style.display = 'none';
                
                // STEP C: Upload area expands to full size
                const currentHeight = this.elements.uploadSection.offsetHeight;
                // Calculate target height: viewport minus header minus main padding
                const mainPadding = window.innerWidth <= 768 ? 48 : 64; // mobile vs desktop padding
                const targetHeight = window.innerHeight - this.initialMeasurements.headerHeight - mainPadding;
                
                // Only animate height, avoid flex animation
                await this.animate(this.elements.uploadSection, [
                    { height: `${currentHeight}px` },
                    { height: `${targetHeight}px` }
                ], { duration: 400 });
                
                this.elements.uploadSection.style.height = '';
                this.elements.uploadSection.style.flex = '1';
                
                // STEP D: Header reappears (height expand + fade in)
                this.elements.header.style.display = 'flex';
                
                await Promise.all([
                    this.animate(this.elements.header, [
                        { opacity: 0, transform: 'translateY(-50px)' },
                        { opacity: 1, transform: 'translateY(0)' }
                    ], { duration: 300 }),
                    this.animate(this.elements.header, [
                        { 
                            height: '0px',
                            paddingTop: '0px',
                            paddingBottom: '0px'
                        },
                        { 
                            height: `${this.initialMeasurements.headerHeight}px`,
                            paddingTop: 'var(--space-xxl)',
                            paddingBottom: 'var(--space-xxl)'
                        }
                    ], { duration: 400 })
                ]);
                
                this.elements.header.style.height = '';
                
                // Reset body styles and main padding (header is back)
                document.body.style.overflow = 'hidden';
                document.body.style.height = '100vh';
                this.elements.uploadSection.parentElement.style.paddingTop = '';
                
                this.state = 'EMPTY';
            } finally {
                this.isAnimating = false;
            }
        }
        
        /**
         * Animate file item appearing
         */
        async animateFileIn(fileElement) {
            await this.animate(fileElement, [
                { opacity: 0, transform: 'translateY(20px)' },
                { opacity: 1, transform: 'translateY(0)' }
            ], { duration: 250 });
        }
        
        /**
         * Animate file item disappearing
         */
        async animateFileOut(fileElement) {
            await this.animate(fileElement, [
                { opacity: 1, transform: 'translateY(0)' },
                { opacity: 0, transform: 'translateY(-20px)' }
            ], { duration: 250 });
        }
        
        /**
         * Format file size consistently: GB > MB > KB
         */
        formatFileSize(bytes) {
            if (bytes >= 1024 * 1024 * 1024) {
                return (bytes / (1024 * 1024 * 1024)).toFixed(1) + 'GB';
            } else if (bytes >= 1024 * 1024) {
                return (bytes / (1024 * 1024)).toFixed(1) + 'MB';
            } else {
                return Math.round(bytes / 1024) + 'KB';
            }
        }
        
        /**
         * Setup all event listeners
         */
        setupEventListeners() {
            // File input change
            this.elements.fileInput.addEventListener('change', (e) => {
                this.handleFiles(e.target.files);
                e.target.value = ''; // Reset input
            });
            
            // Drag and drop setup
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                this.elements.dropArea.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                });
            });
            
            ['dragenter', 'dragover'].forEach(eventName => {
                this.elements.dropArea.addEventListener(eventName, () => {
                    this.elements.dropArea.classList.add('drag-over');
                });
            });
            
            ['dragleave', 'drop'].forEach(eventName => {
                this.elements.dropArea.addEventListener(eventName, () => {
                    this.elements.dropArea.classList.remove('drag-over');
                });
            });
            
            this.elements.dropArea.addEventListener('drop', (e) => {
                this.handleFiles(e.dataTransfer.files);
            });
            
            // Update measurements on resize for responsive animations
            window.addEventListener('resize', () => {
                if (this.state === 'EMPTY') {
                    this.updateMeasurements();
                }
            });
        }
        
        /**
         * Handle file uploads with backend integration
         */
        async handleFiles(files) {
            const isFirstUpload = this.uploadedFiles.length === 0;
            
            // Process each file first (add to DOM, start uploads)
            const fileElements = [];
            for (const file of files) {
                const fileDiv = this.startFileUpload(file);
                fileElements.push(fileDiv);
            }
            
            // Transform UI if this is the first upload
            if (isFirstUpload && files.length > 0 && this.state === 'EMPTY') {
                await this.transformToFileState();
                
                // After transformation, animate files in
                for (const fileDiv of fileElements) {
                    await this.animateFileIn(fileDiv);
                }
            } else {
                // If not first upload, animate files in immediately
                for (const fileDiv of fileElements) {
                    await this.animateFileIn(fileDiv);
                }
            }
        }
        
        /**
         * Start file upload - immediately add to DOM, then upload
         */
        startFileUpload(file) {
            // Create file display element
            const fileDiv = document.createElement('div');
            fileDiv.innerHTML = `
                <div class="file-name">${file.name}</div>
                <div class="file-details">${this.formatFileSize(file.size)}</div>
                <div class="file-progress">
                    <div class="progress-bar" style="width: 0%"></div>
                    <span class="progress-text">Uploading...</span>
                </div>
            `;
            
            // Add to DOM immediately (top of list) but keep invisible
            fileDiv.style.opacity = '0';
            fileDiv.style.transform = 'translateY(20px)';
            this.elements.fileList.insertBefore(fileDiv, this.elements.fileList.firstChild);
            
            // Start upload process (don't await - run in background)
            this.processFileUpload(file, fileDiv);
            
            return fileDiv;
        }
        
        /**
         * Process file upload with progress tracking
         */
        async processFileUpload(file, fileDiv) {
            try {
                // Upload using XMLHttpRequest for progress tracking
                const xhr = new XMLHttpRequest();
                const progressBar = fileDiv.querySelector('.progress-bar');
                const progressText = fileDiv.querySelector('.progress-text');
                
                // Upload progress
                xhr.upload.addEventListener('progress', (e) => {
                    if (e.lengthComputable) {
                        const percentComplete = Math.round((e.loaded / e.total) * 100);
                        progressBar.style.width = `${percentComplete}%`;
                        progressText.textContent = `${percentComplete}%`;
                    }
                });
                
                // Upload complete
                xhr.addEventListener('load', () => {
                    if (xhr.status === 200) {
                        const response = xhr.responseText.trim();
                        const downloadUrl = response;
                        const deleteUrl = xhr.getResponseHeader('X-Url-Delete');
                        
                        // Update file display with actions
                        fileDiv.innerHTML = `
                            <div class="file-name">${file.name}</div>
                            <div class="file-details">${this.formatFileSize(file.size)}</div>
                            <div class="file-actions">
                                <button onclick="animationManager.copyToClipboard('${downloadUrl}', this)">Copy Link</button>
                                <button class="danger" onclick="animationManager.deleteFile('${deleteUrl}', this, '${file.name}')">Delete</button>
    </div>
                        `;
                        
                        // Add to uploaded files array
                        this.uploadedFiles.push({
                            name: file.name,
                            downloadUrl: downloadUrl,
                            deleteUrl: deleteUrl,
                            element: fileDiv
                        });
                        
                        // Update ZIP button after successful upload
                        this.updateZipButton();
                    } else {
                        fileDiv.innerHTML = `
                            <div class="file-name">${file.name}</div>
                            <div class="error-message">Upload failed (${xhr.status}) <button class="error-dismiss" onclick="this.parentElement.parentElement.remove()">×</button></div>
                        `;
                    }
                });
                
                xhr.addEventListener('error', () => {
                    fileDiv.innerHTML = `
                        <div class="file-name">${file.name}</div>
                        <div class="error-message">Upload failed: Network error <button class="error-dismiss" onclick="this.parentElement.parentElement.remove()">×</button></div>
                    `;
                });
                
                // Start upload
                xhr.open('PUT', `/${encodeURIComponent(file.name)}`, true);
                xhr.send(file);
                
            } catch (error) {
                fileDiv.innerHTML = `
                    <div class="file-name">${file.name}</div>
                    <div class="error-message">Upload failed: ${error.message} <button class="error-dismiss" onclick="this.parentElement.parentElement.remove()">×</button></div>
                `;
            }
        }
        
        /**
         * Delete file with animation
         */
        async deleteFile(deleteUrl, button, fileName) {
            if (!confirm('Delete this file? This cannot be undone.')) {
                return;
            }
            
            button.textContent = 'Deleting...';
            button.disabled = true;
            
            try {
                const response = await fetch(deleteUrl, { method: 'DELETE' });
                
                if (response.ok) {
                    // Find and remove file
                    const fileIndex = this.uploadedFiles.findIndex(f => f.name === fileName);
                    if (fileIndex !== -1) {
                        const fileData = this.uploadedFiles[fileIndex];
                        
                        // Animate file disappearing
                        await this.animateFileOut(fileData.element);
                        fileData.element.remove();
                        
                        // Remove from array
                        this.uploadedFiles.splice(fileIndex, 1);
                        
                        // Transform back to empty state if no files left
                        if (this.uploadedFiles.length === 0) {
                            await this.transformToEmptyState();
                        }
                        
                        this.updateZipButton();
                    }
                } else {
                    button.textContent = `Delete failed (${response.status})`;
                    button.disabled = false;
                }
            } catch (error) {
                button.textContent = `Delete failed: ${error.message}`;
                button.disabled = false;
            }
        }
        
        /**
         * Copy text to clipboard
         */
        async copyToClipboard(text, button) {
            try {
                await navigator.clipboard.writeText(text);
                const originalText = button.textContent;
                button.textContent = 'Copied!';
                button.style.backgroundColor = '#28a745';
                setTimeout(() => {
                    button.textContent = originalText;
                    button.style.backgroundColor = '';
                }, 1500);
            } catch (error) {
                // Fallback for older browsers
                const textArea = document.createElement('textarea');
                textArea.value = text;
                textArea.style.position = 'fixed';
                textArea.style.opacity = '0';
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                
                const originalText = button.textContent;
                button.textContent = 'Copied!';
                button.style.backgroundColor = '#28a745';
                setTimeout(() => {
                    button.textContent = originalText;
                    button.style.backgroundColor = '';
                }, 1500);
            }
        }
        
        /**
         * Update ZIP button visibility and functionality
         */
        updateZipButton() {
            if (this.uploadedFiles.length > 0) {
                this.elements.copyZipBtn.style.display = 'block';
                this.elements.copyZipBtn.onclick = () => this.copyZipLink();
            } else {
                this.elements.copyZipBtn.style.display = 'none';
            }
        }
        
        /**
         * Copy ZIP link for all files
         */
        async copyZipLink() {
            if (this.uploadedFiles.length === 0) return;
            
            // Construct ZIP URL from file tokens
            const zipParts = this.uploadedFiles.map(file => {
                const url = new URL(file.downloadUrl);
                const pathParts = url.pathname.split('/');
                const token = pathParts[1];
                const filename = pathParts[2];
                return `${token}/${filename}`;
            });
            
            const zipUrl = `${window.location.origin}/(${zipParts.join(',')}).zip`;
            
            await this.copyToClipboard(zipUrl, this.elements.copyZipBtn);
        }
    }
    
    // Initialize the animation manager
    const animationManager = new TransferSequentialAnimationManager();
    
    // Expose globally for onclick handlers
    window.animationManager = animationManager;
    </script>
</body>
</html>
