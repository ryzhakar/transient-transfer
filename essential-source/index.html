<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Hostname}} - File Sharing</title>
    <meta name="description" content="Share files quickly and securely">
</head>
<body>
    <!-- Skip to main content for keyboard users -->
    <a href="#main-content">Skip to main content</a>
    
    <header>
        <h1>{{.Hostname}}</h1>
        <p>Share files quickly and securely</p>
    </header>
    
    <main id="main-content">
        <section>
            <h2>Upload Files</h2>
            <label for="file-input">Choose files to upload:</label>
            <input type="file" id="file-input" multiple>
        </section>
        
        <section>
            <h2>Your Shared Files</h2>
            <div id="file-list">
                <p>No files shared yet. Upload files to see them here.</p>
            </div>
        </section>
    </main>

    <script>
    // Minimal upload functionality - required due to PUT-only API
    document.getElementById('file-input').addEventListener('change', async function(e) {
        const files = e.target.files;
        const fileList = document.getElementById('file-list');
        
        if (files.length === 0) return;
        
        // Clear empty state
        fileList.innerHTML = '';
        
        for (const file of files) {
            // Add file to list immediately
            const fileDiv = document.createElement('div');
            fileDiv.innerHTML = `
                <p><strong>${file.name}</strong> (${Math.round(file.size/1024)}KB) - Uploading...</p>
            `;
            fileList.appendChild(fileDiv);
            
            try {
                // Upload file using transfer.sh API
                const response = await fetch(`/${encodeURIComponent(file.name)}`, {
                    method: 'PUT',
                    body: file
                });
                
                if (response.ok) {
                    const downloadUrl = await response.text();
                    const deleteUrl = response.headers.get('X-Url-Delete');
                    
                    fileDiv.innerHTML = `
                        <p><strong>${file.name}</strong> (${Math.round(file.size/1024)}KB)</p>
                        <p><a href="${downloadUrl.trim()}">${downloadUrl.trim()}</a></p>
                        ${deleteUrl ? `<p><small><button onclick="deleteFile('${deleteUrl}', this)">Delete File</button></small></p>` : ''}
                    `;
                } else {
                    fileDiv.innerHTML = `
                        <p><strong>${file.name}</strong> - Upload failed (${response.status})</p>
                    `;
                }
            } catch (error) {
                fileDiv.innerHTML = `
                    <p><strong>${file.name}</strong> - Upload failed: ${error.message}</p>
                `;
            }
        }
    });
    
    // Delete file function
    async function deleteFile(deleteUrl, button) {
        if (!confirm('Delete this file? This cannot be undone.')) {
            return;
        }
        
        button.textContent = 'Deleting...';
        button.disabled = true;
        
        try {
            const response = await fetch(deleteUrl, {
                method: 'DELETE'
            });
            
            if (response.ok) {
                // Remove the file div from the page
                button.closest('div').remove();
                
                // If no files left, show empty state
                const fileList = document.getElementById('file-list');
                if (fileList.children.length === 0) {
                    fileList.innerHTML = '<p>No files shared yet. Upload files to see them here.</p>';
                }
            } else {
                button.textContent = `Delete failed (${response.status})`;
                button.disabled = false;
            }
        } catch (error) {
            button.textContent = `Delete failed: ${error.message}`;
            button.disabled = false;
        }
    }
    </script>
</body>
</html>
