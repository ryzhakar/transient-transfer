<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Hostname}} - File Sharing</title>
    <meta name="description" content="Share files quickly and securely">
    <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
    <!-- Skip to main content for keyboard users -->
    <a href="#main-content" class="skip-link">Skip to main content</a>
    
    <header>
        <h1>{{.Hostname}}</h1>
    </header>
    
    <main id="main-content">
        <section>
            <input type="file" id="file-input" multiple>
            
            <button id="copy-zip-btn" onclick="copyZipLink()" style="display: none;">Copy All Files</button>
        </section>
        
        <section>
            <div id="file-list">
                <p>No files shared yet. Upload files to see them here.</p>
            </div>
        </section>
    </main>

    <script>
    // Track uploaded files for ZIP functionality
    let uploadedFiles = [];
    
    // Minimal upload functionality - required due to PUT-only API
    document.getElementById('file-input').addEventListener('change', async function(e) {
        const files = e.target.files;
        const fileList = document.getElementById('file-list');
        
        if (files.length === 0) return;
        
        // Clear empty state if present
        if (fileList.innerHTML.includes('No files shared yet')) {
            fileList.innerHTML = '';
        }
        
        for (const file of files) {
            // Add file to list immediately
            const fileDiv = document.createElement('div');
            fileDiv.innerHTML = `
                <div class="file-name">${file.name}</div>
                <div class="file-details">${Math.round(file.size/1024)}KB</div>
                <div class="file-progress">
                    <div class="progress-bar" style="width: 0%"></div>
                    <span class="progress-text">Uploading...</span>
                </div>
            `;
            
            // Insert at the beginning to show newest first
            if (fileList.firstChild && fileList.firstChild.tagName !== 'P') {
                fileList.insertBefore(fileDiv, fileList.firstChild);
            } else {
                fileList.appendChild(fileDiv);
            }
            
            try {
                // Create XMLHttpRequest for upload progress
                const xhr = new XMLHttpRequest();
                const progressBar = fileDiv.querySelector('.progress-bar');
                const progressText = fileDiv.querySelector('.progress-text');
                
                // Upload progress handler
                xhr.upload.addEventListener('progress', (e) => {
                    if (e.lengthComputable) {
                        const percentComplete = Math.round((e.loaded / e.total) * 100);
                        progressBar.style.width = `${percentComplete}%`;
                        progressText.textContent = `${percentComplete}%`;
                    }
                });
                
                // Upload complete handler
                const uploadPromise = new Promise((resolve, reject) => {
                    xhr.onload = () => {
                        if (xhr.status >= 200 && xhr.status < 300) {
                            resolve(xhr);
                        } else {
                            reject(new Error(`Upload failed: ${xhr.status}`));
                        }
                    };
                    xhr.onerror = () => reject(new Error('Network error'));
                });
                
                // Start upload
                xhr.open('PUT', `/${encodeURIComponent(file.name)}`);
                xhr.send(file);
                
                // Wait for upload to complete
                const xhr_response = await uploadPromise;
                
                if (xhr_response.status >= 200 && xhr_response.status < 300) {
                    const downloadUrl = xhr_response.responseText;
                    const deleteUrl = xhr_response.getResponseHeader('X-Url-Delete');
                    
                    // Add to uploaded files array for ZIP functionality
                    uploadedFiles.push({
                        name: file.name,
                        url: downloadUrl.trim(),
                        deleteUrl: deleteUrl
                    });
                    
                    // Remove progress bar and show actions
                    fileDiv.innerHTML = `
                        <div class="file-name">${file.name}</div>
                        <div class="file-details">${Math.round(file.size/1024)}KB</div>
                        <div class="file-actions">
                            <button onclick="copyToClipboard('${downloadUrl.trim()}', this)">Copy</button>
                            <button class="secondary" onclick="window.open('${downloadUrl.trim()}', '_blank')">Open</button>
                            ${deleteUrl ? `<button class="danger" onclick="deleteFile('${deleteUrl}', this, '${file.name}')">Delete</button>` : ''}
                        </div>
                    `;
                    
                    // Show ZIP button if we have files
                    updateZipButton();
                } else {
                    fileDiv.innerHTML = `
                        <div class="file-name">${file.name}</div>
                        <div class="file-details" style="color: var(--color-danger);">Upload failed (${xhr_response.status})</div>
                    `;
                }
            } catch (error) {
                fileDiv.innerHTML = `
                    <div class="file-name">${file.name}</div>
                    <div class="file-details" style="color: var(--color-danger);">Upload failed: ${error.message}</div>
                `;
            }
        }
    });
    
    // Copy to clipboard function
    async function copyToClipboard(text, button) {
        try {
            await navigator.clipboard.writeText(text);
            const originalText = button.textContent;
            button.textContent = 'Copied!';
            button.style.backgroundColor = '#28a745';
            setTimeout(() => {
                button.textContent = originalText;
                button.style.backgroundColor = '';
            }, 1500);
        } catch (error) {
            // Fallback for older browsers
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.opacity = '0';
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            
            const originalText = button.textContent;
            button.textContent = 'Copied!';
            button.style.backgroundColor = '#28a745';
            setTimeout(() => {
                button.textContent = originalText;
                button.style.backgroundColor = '';
            }, 1500);
        }
    }
    
    // Update ZIP button visibility
    function updateZipButton() {
        const zipBtn = document.getElementById('copy-zip-btn');
        if (uploadedFiles.length > 0) {
            zipBtn.style.display = 'block';
        } else {
            zipBtn.style.display = 'none';
        }
    }
    
    // Copy ZIP link functionality
    async function copyZipLink() {
        if (uploadedFiles.length === 0) return;
        
        // Create ZIP URL using transfer.sh syntax: /(file1,file2).zip
        const filePaths = uploadedFiles.map(file => {
            const url = new URL(file.url);
            return url.pathname.substring(1); // Remove leading slash
        });
        
        const zipUrl = `${window.location.origin}/(${filePaths.join(',')}).zip`;
        
        try {
            await navigator.clipboard.writeText(zipUrl);
            const btn = document.getElementById('copy-zip-btn');
            const originalText = btn.textContent;
            btn.textContent = 'ZIP Link Copied!';
            setTimeout(() => {
                btn.textContent = originalText;
            }, 2000);
        } catch (error) {
            // Fallback for older browsers
            const textArea = document.createElement('textarea');
            textArea.value = zipUrl;
            textArea.style.position = 'fixed';
            textArea.style.opacity = '0';
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            
            const btn = document.getElementById('copy-zip-btn');
            const originalText = btn.textContent;
            btn.textContent = 'ZIP Link Copied!';
            setTimeout(() => {
                btn.textContent = originalText;
            }, 2000);
        }
    }
    
    // Delete file function
    async function deleteFile(deleteUrl, button, fileName) {
        if (!confirm('Delete this file? This cannot be undone.')) {
            return;
        }
        
        button.textContent = 'Deleting...';
        button.disabled = true;
        
        try {
            const response = await fetch(deleteUrl, {
                method: 'DELETE'
            });
            
            if (response.ok) {
                // Remove from uploaded files array
                uploadedFiles = uploadedFiles.filter(file => file.name !== fileName);
                
                // Remove the file div from the page - need to go up to the parent div
                const fileDiv = button.closest('#file-list > div');
                if (fileDiv) {
                    fileDiv.remove();
                }
                
                // Update ZIP button visibility
                updateZipButton();
                
                // If no files left, show empty state
                const fileList = document.getElementById('file-list');
                if (fileList.children.length === 0) {
                    fileList.innerHTML = '<p>No files shared yet. Upload files to see them here.</p>';
                }
            } else {
                button.textContent = `Delete failed (${response.status})`;
                button.disabled = false;
            }
        } catch (error) {
            button.textContent = `Delete failed: ${error.message}`;
            button.disabled = false;
        }
    }
    </script>
</body>
</html>
