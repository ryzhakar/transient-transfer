<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Hostname}} - File Sharing</title>
    <meta name="description" content="Share files quickly and securely">
    <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
    <!-- Skip to main content for keyboard users -->
    <a href="#main-content" class="skip-link">Skip to main content</a>
    
    <header>
        <h1>{{.Hostname}}</h1>
        <p>Share files quickly and securely</p>
    </header>
    
    <main id="main-content">
        <section>
            <h2>Share Files</h2>
            <label for="file-input">Choose files to upload:</label>
            <input type="file" id="file-input" multiple>
            
            <button id="copy-zip-btn" onclick="copyZipLink()" style="display: none;">Copy ZIP Link</button>
        </section>
        
        <section>
            <div id="file-list">
                <p>No files shared yet. Upload files to see them here.</p>
            </div>
        </section>
    </main>

    <script>
    // Track uploaded files for ZIP functionality
    let uploadedFiles = [];
    
    // Minimal upload functionality - required due to PUT-only API
    document.getElementById('file-input').addEventListener('change', async function(e) {
        const files = e.target.files;
        const fileList = document.getElementById('file-list');
        
        if (files.length === 0) return;
        
        // Clear empty state if present
        if (fileList.innerHTML.includes('No files shared yet')) {
            fileList.innerHTML = '';
        }
        
        for (const file of files) {
            // Add file to list immediately
            const fileDiv = document.createElement('div');
            fileDiv.innerHTML = `
                <div class="file-name">${file.name}</div>
                <div class="file-details">${Math.round(file.size/1024)}KB - Uploading...</div>
            `;
            fileList.appendChild(fileDiv);
            
            try {
                // Upload file using transfer.sh API
                const response = await fetch(`/${encodeURIComponent(file.name)}`, {
                    method: 'PUT',
                    body: file
                });
                
                if (response.ok) {
                    const downloadUrl = await response.text();
                    const deleteUrl = response.headers.get('X-Url-Delete');
                    
                    // Add to uploaded files array for ZIP functionality
                    uploadedFiles.push({
                        name: file.name,
                        url: downloadUrl.trim(),
                        deleteUrl: deleteUrl
                    });
                    
                    fileDiv.innerHTML = `
                        <div class="file-name">${file.name}</div>
                        <div class="file-details">${Math.round(file.size/1024)}KB</div>
                        <div class="file-actions">
                            <button onclick="copyToClipboard('${downloadUrl.trim()}', this)">Copy Link</button>
                            <button onclick="window.open('${downloadUrl.trim()}', '_blank')">Open</button>
                            ${deleteUrl ? `<button onclick="deleteFile('${deleteUrl}', this, '${file.name}')">Delete</button>` : ''}
                        </div>
                    `;
                    
                    // Show ZIP button if we have files
                    updateZipButton();
                } else {
                    fileDiv.innerHTML = `
                        <div class="file-name">${file.name}</div>
                        <div class="file-details" style="color: #dc3545;">Upload failed (${response.status})</div>
                    `;
                }
            } catch (error) {
                fileDiv.innerHTML = `
                    <div class="file-name">${file.name}</div>
                    <div class="file-details" style="color: #dc3545;">Upload failed: ${error.message}</div>
                `;
            }
        }
    });
    
    // Copy to clipboard function
    async function copyToClipboard(text, button) {
        try {
            await navigator.clipboard.writeText(text);
            const originalText = button.textContent;
            button.textContent = 'Copied!';
            button.style.backgroundColor = '#28a745';
            setTimeout(() => {
                button.textContent = originalText;
                button.style.backgroundColor = '';
            }, 1500);
        } catch (error) {
            // Fallback for older browsers
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.opacity = '0';
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            
            const originalText = button.textContent;
            button.textContent = 'Copied!';
            button.style.backgroundColor = '#28a745';
            setTimeout(() => {
                button.textContent = originalText;
                button.style.backgroundColor = '';
            }, 1500);
        }
    }
    
    // Update ZIP button visibility
    function updateZipButton() {
        const zipBtn = document.getElementById('copy-zip-btn');
        if (uploadedFiles.length > 0) {
            zipBtn.style.display = 'block';
        } else {
            zipBtn.style.display = 'none';
        }
    }
    
    // Copy ZIP link functionality
    async function copyZipLink() {
        if (uploadedFiles.length === 0) return;
        
        // Create ZIP URL using transfer.sh syntax: /(file1,file2).zip
        const filePaths = uploadedFiles.map(file => {
            const url = new URL(file.url);
            return url.pathname.substring(1); // Remove leading slash
        });
        
        const zipUrl = `${window.location.origin}/(${filePaths.join(',')}).zip`;
        
        try {
            await navigator.clipboard.writeText(zipUrl);
            const btn = document.getElementById('copy-zip-btn');
            const originalText = btn.textContent;
            btn.textContent = 'ZIP Link Copied!';
            setTimeout(() => {
                btn.textContent = originalText;
            }, 2000);
        } catch (error) {
            // Fallback for older browsers
            const textArea = document.createElement('textarea');
            textArea.value = zipUrl;
            textArea.style.position = 'fixed';
            textArea.style.opacity = '0';
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            
            const btn = document.getElementById('copy-zip-btn');
            const originalText = btn.textContent;
            btn.textContent = 'ZIP Link Copied!';
            setTimeout(() => {
                btn.textContent = originalText;
            }, 2000);
        }
    }
    
    // Delete file function
    async function deleteFile(deleteUrl, button, fileName) {
        if (!confirm('Delete this file? This cannot be undone.')) {
            return;
        }
        
        button.textContent = 'Deleting...';
        button.disabled = true;
        
        try {
            const response = await fetch(deleteUrl, {
                method: 'DELETE'
            });
            
            if (response.ok) {
                // Remove from uploaded files array
                uploadedFiles = uploadedFiles.filter(file => file.name !== fileName);
                
                // Remove the file div from the page - need to go up to the parent div
                const fileDiv = button.closest('#file-list > div');
                if (fileDiv) {
                    fileDiv.remove();
                }
                
                // Update ZIP button visibility
                updateZipButton();
                
                // If no files left, show empty state
                const fileList = document.getElementById('file-list');
                if (fileList.children.length === 0) {
                    fileList.innerHTML = '<p>No files shared yet. Upload files to see them here.</p>';
                }
            } else {
                button.textContent = `Delete failed (${response.status})`;
                button.disabled = false;
            }
        } catch (error) {
            button.textContent = `Delete failed: ${error.message}`;
            button.disabled = false;
        }
    }
    </script>
</body>
</html>
