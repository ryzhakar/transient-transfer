<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Hostname}} - Transfer Files</title>
    <meta name="description" content="Simple, fast file sharing. Upload files and share them instantly.">
</head>
<body>
    <header>
        <h1>Transfer Files</h1>
    </header>

    <main>
        <section>
            <form action="/upload" method="post" enctype="multipart/form-data" id="upload-form">
                <div class="upload-area">
                    <label for="file-input">Choose files or drag them here</label>
                    <input type="file" id="file-input" name="files" multiple required accept="*/*">
                </div>
                
                <button type="submit">Upload</button>
            </form>

            <div class="upload-progress" hidden aria-live="polite">
                <progress value="0" max="100" aria-describedby="progress-text"></progress>
                <div id="progress-text">0% complete</div>
            </div>
            
            <div class="file-list" role="region" aria-live="polite">
                <p>No files uploaded yet.</p>
            </div>
        </section>

    </main>

    <footer>
        <p>Files expire automatically.</p>
    </footer>

    <!-- Progressive enhancement -->
    <script src="/scripts/main.js" defer></script>
    <link rel="stylesheet" href="/styles/main.css">
</body>
</html>
