<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Filename}} - {{.Hostname}}</title>
    <meta name="description" content="Download {{.Filename}} shared via Transfer.sh">
    <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
    <!-- Skip link for accessibility -->
    <a href="#main-content" class="skip-link">Skip to main content</a>
    
    <!-- Bento Workspace: Consistent with main page -->
    <div class="bento-workspace">
        
        <!-- Primary Bento Block: Download content -->
        <main class="bento-block bento-primary" id="main-content" role="main">
            <h1><a href="/">{{.Hostname}}</a></h1>
            <h2>{{.Filename}}</h2>
            
            <div class="download-actions">
                <a href="{{.URLGet}}" class="button-primary" download>
                    Download File
                </a>
                <button type="button" class="button-secondary" onclick="copyCurrentUrl(this)">
                    Copy Link
                </button>
            </div>
        </main>
        
        <!-- Secondary Bento Block: File info -->
        <aside class="bento-block bento-secondary" role="complementary">
            <h3>File Information</h3>
            <dl class="file-info-list">
                <dt>Filename:</dt>
                <dd>{{.Filename}}</dd>
                <dt>Shared via:</dt>
                <dd>{{.Hostname}}</dd>
            </dl>
        </aside>
        
        <!-- Context block -->
        <footer class="bento-block bento-context">
            <p>Files expire automatically. <a href="/">Share your own files</a></p>
        </footer>
        
    </div>


    <script>
        function copyCurrentUrl(button) {
            const originalText = button.textContent;
            const url = window.location.href;
            navigator.clipboard.writeText(url).then(() => {
                button.textContent = 'Copied!';
                setTimeout(() => {
                    button.textContent = originalText;
                }, 2000);
            }).catch(() => {
                // Fallback for older browsers
                const textArea = document.createElement('textarea');
                textArea.value = url;
                textArea.style.position = 'fixed';
                textArea.style.opacity = '0';
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                button.textContent = 'Copied!';
                setTimeout(() => {
                    button.textContent = originalText;
                }, 2000);
            });
        }
    </script>
</body>
</html>
