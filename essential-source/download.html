<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Filename}} - {{.Hostname}}</title>
    <meta name="description" content="Download {{.Filename}} shared via Transfer.sh">
</head>
<body>
    <header>
        <h1><a href="/">Transfer Files</a></h1>
    </header>

    <main>
        <section>
            <h2>{{.Filename}}</h2>
            
            <div class="download-actions">
                <a href="{{.URLGet}}" class="button" download>
                    Download
                </a>
                <button type="button" class="secondary" onclick="copyCurrentUrl(this)">
                    Copy Link
                </button>
            </div>
        </section>
    </main>


    <script>
        function copyCurrentUrl(button) {
            const originalText = button.textContent;
            const url = window.location.href;
            navigator.clipboard.writeText(url).then(() => {
                button.textContent = 'Copied!';
                setTimeout(() => {
                    button.textContent = originalText;
                }, 2000);
            }).catch(() => {
                // Fallback
                const textArea = document.createElement('textarea');
                textArea.value = url;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                button.textContent = 'Copied!';
                setTimeout(() => {
                    button.textContent = originalText;
                }, 2000);
            });
        }
    </script>
    <link rel="stylesheet" href="/styles/main.css">
</body>
</html>
