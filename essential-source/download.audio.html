<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Filename}} - {{.Hostname}}</title>
    <meta name="description" content="Listen to and download {{.Filename}} shared via Transfer.sh">
    <meta property="og:type" content="audio">
</head>
<body>
    <header>
        <h1><a href="/">Transfer Files</a></h1>
    </header>

    <main>
        <section>
            <div class="file-preview">
                <audio controls preload="metadata" style="width: 100%;">
                    <source src="{{.URL}}" type="{{.ContentType}}">
                    <p>Your browser doesn't support audio playback. <a href="{{.URLGet}}" download>Download the audio file</a> to listen to it.</p>
                </audio>
            </div>

            <div class="download-actions">
                <a href="{{.URLGet}}" class="button" download>
                    Download
                </a>
                <button type="button" class="secondary" onclick="copyCurrentUrl(this)">
                    Copy Link
                </button>
            </div>
        </section>
    </main>


    <script>
        function copyCurrentUrl(button) {
            const originalText = button.textContent;
            navigator.clipboard.writeText(window.location.href).then(() => {
                button.textContent = 'Copied!';
                setTimeout(() => {
                    button.textContent = originalText;
                }, 2000);
            }).catch(() => {
                // Fallback
                const textArea = document.createElement('textarea');
                textArea.value = window.location.href;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                button.textContent = 'Copied!';
                setTimeout(() => {
                    button.textContent = originalText;
                }, 2000);
            });
        }
    </script>
    <link rel="stylesheet" href="/styles/main.css">
</body>
</html>
