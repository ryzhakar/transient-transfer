<div class="delete-section">
    <button id="fire-delete" class="btn-secondary delete-btn">Delete File</button>
</div>

<div class="delete-modal" id="delete-modal">
    <div class="modal-overlay"></div>
    <div class="modal-content">
        <div class="modal-header">
            <h3>Delete File</h3>
        </div>
        <div class="modal-body">
            <p>Enter the deletion token to permanently remove this file:</p>
            <input type="text" id="deletion-token" placeholder="Deletion token" class="token-input">
            <div id="error" class="error-message"></div>
        </div>
        <div class="modal-actions">
            <button id="confirm-delete" class="btn-primary">Delete</button>
            <button id="cancel-delete" class="btn-secondary">Cancel</button>
        </div>
    </div>
</div>
